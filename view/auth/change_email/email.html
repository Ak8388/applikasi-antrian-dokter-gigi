<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css">
    <title>changeEmail</title>
</head>
<body>
    <section id="topS">
        <div>
            <img src="../../assets/photos/home/GikuLogo.png" alt="">
            <h1>GIGIKU</h1>
        </div>
    </section>
    <section id="bottomS">

    </section>
    <div id="email-box">
        <div id="img-ctnr">
            <img src="../../assets/photos/auth/info.png" alt="InformationLogo">
        </div>
        <div>
            <h2>Change Email</h2>
            <p>Masukan email baru</p>
        </div>
        <form action="" id="form-email">
            <label for="email">Email</label>
            <input type="email" name="" id="email" required placeholder="example@gmail.com">
            <button type="click">Submit</button>
        </form>
    </div>
    <div id="overlay" class="overlay">
        <div class="alert-box">
            <div class="close-icon">X</div>
            <div id="text-alert"></div>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>
</html>
