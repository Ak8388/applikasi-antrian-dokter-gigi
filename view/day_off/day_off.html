<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Hari Libur Dokter</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_green.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <h1>Doctor's Days Off</h1>
        <div id="ctr-add"><button id="btn-add">ADD</button></div>
        <table id="daysOffTable">
            <thead>
                <tr>
                    <th>No</th>
                    <th>Date</th>
                    <th>Description</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody>
                <!-- Data will be populated here by JavaScript -->
            </tbody>
        </table>
    </div>
    <div id="ctr-day-off">
        <h1>Tambah Hari Libur Dokter</h1>
        <form id="date-cntr" class="card-date" action="#" method="post">
            <label for="dateInput">Pilih Tanggal Libur:</label>
            <input type="date" id="dateInput" name="dateInput" required>
            <textarea name="" id="descript" cols="30" rows="3" placeholder="set your description"></textarea>
            <div class="btn-ctr">
                <button id="add-btn" type="button">Submit</button>
                <button id="cncl-btn" type="button">Cancel</button>
            </div>
        </form>
    </div>
    <!-- Dialog Alert -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <p>Apakah Anda yakin ingin menghapus data ini?</p>
            <div id="ctr-btn-modal">
                <button class="modal-button yes" id="confirmYes">Ya</button>
                <button class="modal-button no" id="confirmNo">Batal</button>
            </div>
        </div>
    </div>
    <!-- Alert -->
    <div id="overlay" class="overlay">
        <div class="alert-box">
            <div class="close-icon">X</div>
            <div id="text-alert"></div>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>
    <script>
    </script>
    <script src="./script.js"></script>
</body>

</html>
