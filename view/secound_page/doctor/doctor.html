<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Doctors Page</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 8px;
        }

        .section {
            display: none;
        }

        /* Menyembunyikan semua section pada awalnya */
        .section.active {
            display: block;
        }

        /* Menampilkan hanya section yang aktif */
    </style>
</head>

<body id="bod">
    <div class="sidebar">
        <h2>Klinik Gigi</h2>
        <ul>
            <li id="schedule-page"><a href="#schedule">My Schedule</a></li>
            <li id="appoitments-page"><a href="../admin/appoitment/appoitment.html">Appointments</a></li>
            <li onclick="setingClick()"><a href="#settings">Settings</a></li>
        </ul>
    </div>
    <div class="content">
        <div class="header">
            <h1>Dostors Pages</h1>
            <button onclick="toggleSidebar()">☰</button>
        </div>
        <div id="schedule" class="section">
            <div id="title-page">
                <h1>Jadwal Praktik Dokter</h1>
            </div>
            <div id="day-filter">
                <label for="days-filter">Filter Hari:</label>
                <select id="days-filter">
                    <option value="">Semua Hari</option>
                    <option value="Monday">Senin</option>
                    <option value="Tuesday">Selasa</option>
                    <option value="Wednesday">Rabu</option>
                    <option value="Thursday">Kamis</option>
                    <option value="Friday">Jum'at</option>
                    <option value="Saturday">Sabtu</option>
                    <option value="Sunday">Minggu</option>
                </select>
            </div>
            
            <div id="ctr-btn"><button id="btn-add">ADD</button></div>

            <table id="scheduleTable">
                <thead>
                    <tr>
                        <th>Nama Dokter</th>
                        <th>Hari</th>
                        <th>Jam Praktik</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
        <div id="appointments" class="section">
        </div>
        <div id="settings" class="section">
            <div id="seting-card" class="card-setting">
                <div class="card-header">
                  <button id="close-btn" id="btn" onclick="closeCardSetting()">×</button>
                </div>
                <button class="menu-item" onclick="changePassword()">
                  <img src="https://img.icons8.com/ios-filled/50/000000/lock.png" alt="Change Password Icon" />
                  Change Password
                </button>
                <button class="menu-item" onclick="changeEmail()">
                    <img src="https://img.icons8.com/ios-filled/50/000000/email.png" alt="Change Email Icon" />
                    Change Email
                </button>
                <button class="menu-item" onclick="updateProfile()">
                  <img src="https://img.icons8.com/ios-filled/50/000000/user.png" alt="Update Profile Icon" />
                  Update Profile
                </button>
                <button class="menu-item" onclick="logOut()">
                  <img src="https://img.icons8.com/ios-filled/50/000000/logout-rounded-left.png" alt="Log Out Icon" />
                  Log Out
                </button>
              </div>
        </div>
    </div>
    <a href="../../update_profile/update_profile.html"></a>
    <div class="card" id="card-sche">
        <h2>Add Doctor Schedule</h2>
        <form id="scheduleForm">
            <label for="day">Day:</label>
            <select id="day" name="day" required>
                <option value="">Select a day</option>
                <option value="Monday">Monday</option>
                <option value="Tuesday">Tuesday</option>
                <option value="Wednesday">Wednesday</option>
                <option value="Thursday">Thursday</option>
                <option value="Friday">Friday</option>
                <option value="Saturday">Saturday</option>
                <option value="Sunday">Sunday</option>
            </select>
            <label for="openingHours">Opening Hours:</label>
            <input type="time" id="openingHours" name="openingHours" required>
            <label for="closingHours">Closing Hours:</label>
            <input type="time" id="closingHours" name="closingHours" required>
            <div class="button-group">
                <button type="button" id="cancelBtn">Cancel</button>
                <button id="add-btn">Add</button>
            </div>
        </form>
    </div>

    <!-- Dialog konfirmasi -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <p>Apakah Anda yakin ingin menghapus data ini?</p>
            <button class="modal-button yes" id="confirmYes">Ya</button>
            <button class="modal-button no" id="confirmNo">Batal</button>
        </div>
    </div>

    <!-- Alert -->
    <div id="overlay" class="overlay">
        <div class="alert-box">
            <div class="close-icon" id="closeIcons">X</div>
            <div id="text-alert"></div>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>
    <script src="./script.js"></script>
</body>

</html>
