<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Riwayat Pembayaran</title>
    <link rel="stylesheet" href="my-payment.css">
</head>

<body>
    <div class="container">
        <h1>Riwayat Pembayaran</h1>

        <div class="filter-container">
            <label for="statusFilter">Filter Status Pembayaran:</label>
            <select id="statusFilter">
                <option value="">Semua</option>
                <option value="Paid">Dibayar</option>
                <option value="Order">Tertunda</option>
                <option value="Expired">Kadaluarsa</option>
                <option value="Cancel">Batal</option>
            </select>
        </div>
        <div id="cntr-table">
            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Tanggal Pembayaran</th>
                        <th>Jumlah yang Harus Dibayar</th>
                        <th>Status Pembayaran</th>
                        <th>Pembayaran Untuk</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="paymentHistory">
                   
                </tbody>
            </table>
        </div>
    </div>

    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <p id="text-warn">Apakah anda yakin untuk membatalkan pembayaran ini?</p>
            <button class="modal-button yes" id="confirmYes">Ya</button>
            <button class="modal-button no" id="confirmNo">Batal</button>
        </div>
    </div>

    <div id="overlay" class="overlay">
        <div class="alert-box">
            <div class="close-icon">X</div>
            <div id="text-alert"></div>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>
    <script src="my-payment.js">
    </script>
</body>

</html>
