    <section id="main">
        <div id="wellcome">
            <div id="name-patient">
                <h2 id="patient-name-text"></h2>
            </div>
        </div>
        <nav>
            <div id="cardMenu" class="card-menu"></div>
        </nav>
        <main id="mid-content">
            <div class="slider-container">
                <div class="slider" id="slider">
                   
                </div>
            </div>
        </main>
        <!-- Setting -->
        <div id="settings" class="section">
            <div id="seting-card" class="card-setting">
                <div class="card-header">
                    <button id="close-btn" id="btn" onclick="closeCardSetting()">×</button>
                </div>
                <button class="menu-item" onclick="changePassword()">
                    <img src="https://img.icons8.com/ios-filled/50/000000/lock.png" alt="Change Password Icon" />
                    Change Password
                </button>
                <button class="menu-item" onclick="changeEmail()">
                    <img src="https://img.icons8.com/ios-filled/50/000000/email.png" alt="Change Email Icon" />
                    Change Email
                </button>
                <button class="menu-item" onclick="updateProfile()">
                    <img src="https://img.icons8.com/ios-filled/50/000000/user.png" alt="Update Profile Icon" />
                    Update Profile
                </button>
                <button class="menu-item" onclick="logOut()">
                    <img src="https://img.icons8.com/ios-filled/50/000000/logout-rounded-left.png" alt="Log Out Icon" />
                    Log Out
                </button>
            </div>
        </div>

        <!-- News Dental -->
        <div class="sliderr-container">
            <button class="slider-btn prev" disabled><i class="fas fa-chevron-left"></i></button>
            <div class="sliderr" id="sliderr">
                <!-- News Cards will be inserted here by JavaScript -->
            </div>
            <button class="slider-btn next"><i class="fas fa-chevron-right"></i></button>
        </div>

        <!-- Alert -->
        <div id="overlay" class="overlay">
            <div class="alert-box">
                <div class="close-icon">X</div>
                <div id="text-alert"></div>
                <button onclick="closeAlert()">OK</button>
            </div>
        </div>
    </section>
