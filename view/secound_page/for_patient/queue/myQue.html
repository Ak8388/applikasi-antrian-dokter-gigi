<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antrian Pasien</title>
    <link rel="stylesheet" href="myQue.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_green.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        button:disabled {
            background-color: #ccc;
            color: #666;
            cursor: not-allowed;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1 id="hello">Selamat Datang</h1>
        </header>

        <section class="filter-section">
            <label for="status-filter">Filter Status Antrian:</label>
            <select id="status-filter">
                <option value="Created">Menunggu</option>
                <option value="Process">Dalam Pemeriksaan</option>
                <option value="Reschedule">Ubah Jadwal</option>
                <Option value="Cancel">Batal</Option>
                <option value="Finish">Selesai</option>
            </select>
        </section>

        <section class="queue-section">
            <h2>Antrian Anda</h2>
            <table>
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Pasien</th>
                        <th>Dokter</th>
                        <th>Tanggal</th>
                        <th>No Antrian</th>
                        <th>Jam</th>
                        <th>Status</th>
                        <th>Aksi</th>
                    </tr>
                </thead>
                <tbody id="queue-table-body">
                    <!-- Contoh data antrian -->
                </tbody>
            </table>
        </section>
    </div>

    <div id="date-card" class="card-date">
        <h2>Pilih Tanggal</h2>
        <div>
            <input type="date" id="dateInput">
        </div>
        <div id="time-reservation-cntr">

        </div>
        <button id="dateBtn" disabled>Submit</button>
        <button id="cancel-btn">Cancel</button>
    </div>

    <!-- Dialog konfirmasi -->
    <div id="confirmModal" class="modal">
        <div class="modal-content">
            <p id="text-warn"></p>
            <button class="modal-button yes" id="confirmYes">Ya</button>
            <button class="modal-button no" id="confirmNo">Batal</button>
        </div>
    </div>
    <div id="overlay" class="overlay">
        <div class="alert-box">
            <div id="icon-close" class="close-icon">X</div>
            <div id="text-alert"></div>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>

    <div id="card-refund-pay" class="card-refund">
        <h2>Refund Payment</h2>
        <p>mohon masukan akun bank anda dengan benar untuk proses refund dana!</p>
        <form>
            <input type="text" id="bankName" placeholder="Masukan nama Bank" required>
            <input type="text" id="accountNumber" placeholder="Masukkan nomor rekening" required disabled>
            <div id="ctr-btn">
                <button type="button" id="submitButton" disabled>Submit</button>
                <button type="button" id="cncl-btn">Cancel</button>
            </div>
        </form>
    </div>

</body>

</html>
