<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./reservasi.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <title>Document</title>
</head>

<body>
    <header id="header">

    </header>
    <main id="mn">
        <h2>Doctors :</h2>
    </main>

    <div id="cntr-card" class="cntr" class="container d-flex justify-content-center">
        <div class="card p-4">
            <div class=" image d-flex flex-column justify-content-center align-items-center"> <button
                    class="btn btn-secondary"> <img id="dr-img" src="" alt="Dokter Profile" height="100"
                        width="100" /></button> <span id="drName" class="name mt-3" id="dr-name">DrName</span>
                <div id="cntr-addr" class="mt-3 d-flex flex-row justify-content-center align-items-center">
                    <span id="dr-add" class="idd1">DrAddress</span>
                </div>
                <div class="d-flex flex-column justify-content-center align-items-center mt-3 fd">
                    <div class="text mt-3">
                        <h4>Jadwal Dokter<br></h4>
                    </div>
                    <table id="table">
                        <thead>
                            <tr>
                                <th>#Hari</th>
                                <th>#JamMulai</th>
                                <th>#JamTutup</th>
                            </tr>
                        </thead>
                        <tr id="sche-value">

                        </tr>
                    </table>
                </div>
                <div id="des-cntr" class="d-flex flex-column justify-content-center mt-5">
                    <h4>Deskripsi</h4>
                </div>
            </div>
            <button id="nxt-btn">Selanjutnya</button>
        </div>
    </div>

    <div id="date-card" class="card-date">
        <h2>Pilih Tanggal</h2>
        <div>
            <input type="date" id="dateInput">
        </div>
        <div id="time-reservation-cntr">

        </div>
        <button id="dateBtn">Submit</button>
    </div>

    <div id="overlay" class="overlay">
        <div class="alert-box">
            <div class="close-icon">X</div>
            <div id="text-alert"></div>
            <button onclick="closeAlert()">OK</button>
        </div>
    </div>


    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const dateInput = document.getElementById('dateInput');
            const theDay = new Date();
            const maxDate = new Date();
            maxDate.setDate(theDay.getDate() + 30);

            // Format tanggal menjadi YYYY-MM-DD
            const maxDateString = maxDate.toISOString().split('T')[0];
            dateInput.setAttribute('max', maxDateString);

            var today = new Date();
            var dd = String(today.getDate()).padStart(2, '0');
            var mm = String(today.getMonth() + 1).padStart(2, '0'); //January is 0!
            var yyyy = today.getFullYear();

            today = yyyy + '-' + mm + '-' + dd;
            dateInput.setAttribute("min", today);

        });
    </script>

    <script src="./reservasi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
